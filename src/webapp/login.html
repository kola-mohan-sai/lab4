<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Add Student</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Add Student</h2>

    <form action="add" method="post">

        <label for="name">
            Student Name
        </label>

        <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter student name"
                required
        >

        <label for="branch">
            Branch
        </label>

        <input
                type="text"
                id="branch"
                name="branch"
                placeholder="Enter branch"
                required
        >

        <button type="submit">
            Add Student
        </button>

    </form>

</div>

</body>

</html>
